name: 小蜂管家云抓包
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK 下载地址'
        required: true
        default: 'https://aka.doubaocdn.com/s/tKK0BSzV37'
      capture_seconds:
        description: '抓包时长（秒）'
        required: false
        default: '90'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK
        run: |
          curl -sL -o app.apk "${{ github.event.inputs.apk_url }}"
          echo "MD5: $(md5sum app.apk | cut -d' ' -f1)"
          ls -la app.apk

      - name: 启动模拟器并抓包
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: >-
            set -x;
            echo "MAIN_SCRIPT_START $(date -u +%H:%M:%S)" > /tmp/main_script_ran.txt;
            echo "===== 1. boot 确认 =====";
            adb wait-for-device;
            for i in $(seq 1 30); do
              BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r');
              echo "boot_check[$i]=$BOOT";
              [ "$BOOT" = "1" ] && break;
              sleep 5;
            done;
            echo "boot_final=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')";
            echo "===== 2. 安装 frida =====";
            pip install -q frida==17.23.3 frida-tools 2>&1 | tail -2;
            curl -sL -o /tmp/fs.xz https://github.com/frida/frida/releases/download/17.23.3/frida-server-17.23.3-android-x86_64.xz;
            xz -d -f /tmp/fs.xz;
            ls -la /tmp/fs;
            echo "===== 3. 安装 APK =====";
            adb install -r app.apk && echo "APK_INSTALL_OK" || echo "APK_INSTALL_FAIL";
            echo "===== 4. 启动 frida-server =====";
            adb root || true;
            adb wait-for-device;
            adb push /tmp/fs /data/local/tmp/frida-server;
            adb shell chmod 755 /data/local/tmp/frida-server;
            adb shell "nohup /data/local/tmp/frida-server >/dev/null 2>&1 &";
            sleep 3;
            adb shell "ps -A | grep frida" || echo "FRIDA_SERVER_NOT_RUNNING";
            echo "===== 5. 注入抓包 =====";
            CAP=${{ github.event.inputs.capture_seconds }};
            frida -U -f com.jf.jlinkiot -l ci_hook.js -o /tmp/jf_out.txt 2>/tmp/frida_err.txt & FPID=$!;
            echo "frida_pid=$FPID";
            sleep 15;
            echo "===== 6. 自动 UI 操作 =====";
            python3 ui_auto.py || echo "UI_AUTO_FAIL";
            echo "===== 7. 等待抓包 =====";
            sleep $((CAP - 25 < 10 ? 10 : CAP - 25));
            kill $FPID 2>/dev/null || true;
            sleep 2;
            echo "===== frida 输出 =====";
            cat /tmp/jf_out.txt || echo "(无 jf_out 输出)";
            echo "===== frida 错误 =====";
            cat /tmp/frida_err.txt || echo "(无 frida_err)";
            echo "===== 8. App 状态 =====";
            adb shell pidof com.jf.jlinkiot && echo "APP_RUNNING" || echo "APP_NOT_RUNNING";
            adb logcat -d > /tmp/logcat.txt || true;
            echo "MAIN_SCRIPT_DONE $(date -u +%H:%M:%S)" >> /tmp/main_script_ran.txt

      - name: 上传抓包结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jf-capture-output
          path: |
            /tmp/jf_out.txt
            /tmp/frida_err.txt
            /tmp/logcat.txt
            /tmp/main_script_ran.txt
