name: 小蜂管家云抓包
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK 下载地址'
        required: true
        default: 'https://aka.doubaocdn.com/s/tKK0BSzV37'
      capture_seconds:
        description: '抓包时长（秒）'
        required: false
        default: '90'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 下载 APK
        run: |
          curl -sL -o app.apk "${{ github.event.inputs.apk_url }}"
          echo "MD5: $(md5sum app.apk | cut -d' ' -f1)"
          ls -la app.apk

      - name: 启动模拟器并抓包
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 25
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: >-
            echo "MAIN_SCRIPT_START $(date -u +%H:%M:%S)" > /tmp/main_script_ran.txt;
            echo "===== boot 确认 =====";
            adb wait-for-device;
            for i in $(seq 1 40); do BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); echo "boot_check[$i]=$BOOT"; if [ "$BOOT" = "1" ]; then break; fi; sleep 5; done;
            echo "boot_final=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')";
            echo "===== 安装 APK =====";
            adb install -r app.apk && echo "APK_INSTALL_OK" || echo "APK_INSTALL_FAIL";
            echo "===== 启动 App =====";
            adb shell monkey -p com.jf.jlinkiot -c android.intent.category.LAUNCHER 1 || echo "MONKEY_FAIL";
            echo "===== 等待 App 初始化（翻译运行较慢）=====";
            sleep 200;
            PID=$(adb shell pidof com.jf.jlinkiot 2>/dev/null | tr -d '\r');
            echo "PID=$PID";
            if [ -n "$PID" ]; then echo "===== 进程信息 ====="; fi;
            if [ -n "$PID" ]; then adb shell "ps -A | grep jlinkiot" || echo "NO_PROC"; fi;
            if [ -n "$PID" ]; then adb shell "su -c 'cat /proc/$PID/maps'" > /tmp/maps.txt || echo "MAPS_FAIL"; fi;
            if [ -n "$PID" ]; then echo "===== 内存 grep AesKey ====="; fi;
            if [ -n "$PID" ]; then adb shell "su -c 'grep -a -o -E \"AesKey[^\\\"]{0,160}\" /proc/$PID/mem'" > /tmp/memgrep1.txt 2>/tmp/memgrep1_err.txt; fi;
            if [ -n "$PID" ]; then echo "memgrep1_len=$(wc -c < /tmp/memgrep1.txt 2>/dev/null)"; fi;
            if [ -n "$PID" ]; then cat /tmp/memgrep1.txt | head -50; fi;
            if [ -n "$PID" ]; then echo "===== 内存 grep aesKey/其他 ====="; fi;
            if [ -n "$PID" ]; then adb shell "su -c 'grep -a -o -E \"aesKey[^\\\"]{0,160}\" /proc/$PID/mem'" > /tmp/memgrep2.txt 2>/tmp/memgrep2_err.txt; fi;
            if [ -n "$PID" ]; then echo "memgrep2_len=$(wc -c < /tmp/memgrep2.txt 2>/dev/null)"; fi;
            if [ -n "$PID" ]; then cat /tmp/memgrep2.txt | head -50; fi;
            if [ -n "$PID" ]; then echo "===== 内存 grep authSignInfo JSON ====="; fi;
            if [ -n "$PID" ]; then adb shell "su -c 'grep -a -o -E \"authSignInfo.{0,300}\" /proc/$PID/mem'" > /tmp/memgrep3.txt 2>/dev/null; fi;
            if [ -n "$PID" ]; then echo "memgrep3_len=$(wc -c < /tmp/memgrep3.txt 2>/dev/null)"; fi;
            if [ -n "$PID" ]; then cat /tmp/memgrep3.txt | head -20; fi;
            if [ -n "$PID" ]; then echo "===== 内存 grep XCloudSDK ====="; fi;
            if [ -n "$PID" ]; then adb shell "su -c 'grep -a -o -E \"XCloudSDK[A-Za-z0-9_.]{0,60}\" /proc/$PID/mem'" > /tmp/memgrep4.txt 2>/dev/null; fi;
            if [ -n "$PID" ]; then echo "memgrep4_len=$(wc -c < /tmp/memgrep4.txt 2>/dev/null)"; fi;
            if [ -n "$PID" ]; then cat /tmp/memgrep4.txt | head -20; fi;
            if [ -z "$PID" ]; then echo "APP_NOT_RUNNING"; fi;
            adb logcat -d > /tmp/logcat.txt || true;
            echo "MAIN_SCRIPT_DONE $(date -u +%H:%M:%S)" >> /tmp/main_script_ran.txt

      - name: 上传抓包结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jf-capture-output
          path: |
            /tmp/maps.txt
            /tmp/memgrep1.txt
            /tmp/memgrep1_err.txt
            /tmp/memgrep2.txt
            /tmp/memgrep2_err.txt
            /tmp/memgrep3.txt
            /tmp/memgrep4.txt
            /tmp/logcat.txt
            /tmp/main_script_ran.txt
